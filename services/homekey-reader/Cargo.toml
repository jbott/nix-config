# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "homekey-reader"
version = "0.1.0"
edition = "2021"
authors = ["John Ott"]
description = "Apple Home Key NFC reader for the PN532 with a HomeKit lock accessory and optional ESPHome switch control"
repository = "https://github.com/jbott/nix-config"
readme = "README.md"
license = "(MIT OR Apache-2.0) AND Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
pn532 = { version = "0.5", features = ["std"] }
serialport = { version = "4.8", default-features = false }
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ciborium = "0.2"
cmac = "0.7"
ed25519-dalek = "2"
fs2 = "0.4"
hex = { version = "0.4", features = ["serde"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
hap-crypto = "1.4"
hap-tlv8 = "1"
httparse = "1"
mdns-sd = "0.17"
esphome-client = { version = "0.2.1", default-features = false, features = ["api-1-10"] }
tokio = { version = "1", features = ["rt","time","net","sync","macros","io-util"] }

snow = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
