version: 2
updates:
  # Keeps the SHA-pinned actions current; the version comment is updated too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ".github"
    groups:
      actions:
        patterns: ["*"]
